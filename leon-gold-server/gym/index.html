<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>روتین من</title>
<meta name="description" content="برنامه روزانه تمرین، رژیم و خواب">
<meta name="robots" content="noindex,nofollow">
<meta name="theme-color" content="#f2f4fa">
<script>
// light white-and-blue unless this device chose dark (or "like the phone") in the ☰ menu; set before paint so nothing flashes
(function () { var t = "light"; try { t = localStorage.getItem("gym.theme") || "light"; } catch (e) {} document.documentElement.dataset.theme = t; })();
</script>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="روتین">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-512.png" type="image/png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;500;700;800&display=swap">
<style>
/* Layout: login screen, then a sticky header, one view at a time, and a bottom tab bar (phone first) */
/* white and electric blue; dark navy when the user picks dark (or "like the phone" and the phone is dark) */
:root{
  --bg:#f2f4fa; --surface:#ffffff; --fg:#121832; --muted:#5d6782; --line:#e0e5f1;
  --accent:#3355ff; --accent-soft:#e5eaff; --warn:#b45309; --warn-soft:#fdf0dc; --done:#a7aec2;
  --bad:#d32f2f; --bad-soft:#fde7e7; --on:#ffffff;
  --font:"Vazirmatn",Tahoma,"Segoe UI",sans-serif; color-scheme:light;
}
@media (prefers-color-scheme:dark){:root[data-theme="auto"]{
  --bg:#0c1120; --surface:#151c2f; --fg:#e9edf8; --muted:#9aa3bf; --line:#253049;
  --accent:#6f8bff; --accent-soft:#1d2752; --warn:#f5b86b; --warn-soft:#3a2a17; --done:#5e6884;
  --bad:#f87171; --bad-soft:#3a1d1d; --on:#0c1120; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0c1120; --surface:#151c2f; --fg:#e9edf8; --muted:#9aa3bf; --line:#253049;
  --accent:#6f8bff; --accent-soft:#1d2752; --warn:#f5b86b; --warn-soft:#3a2a17; --done:#5e6884;
  --bad:#f87171; --bad-soft:#3a1d1d; --on:#0c1120; color-scheme:dark}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--font);font-size:15px;line-height:1.75;direction:rtl;
  -webkit-tap-highlight-color:transparent}
button,input,select,textarea{font:inherit;color:inherit}
input,select,textarea{font-size:16px}
[hidden]{display:none!important}
.wrap{max-width:760px;margin:0 auto;display:flex;flex-direction:column;gap:18px;
  padding:16px max(16px,env(safe-area-inset-right)) calc(96px + env(safe-area-inset-bottom)) max(16px,env(safe-area-inset-left))}
h1{font-size:1.45rem;font-weight:800;margin:0;text-wrap:balance;line-height:1.5}
h2{font-size:1.1rem;font-weight:700;margin:0 0 10px}
h3{font-size:1rem;font-weight:700;margin:14px 0 6px}
.sub{color:var(--muted);margin:0;font-size:.9rem}
.focusable:focus-visible,button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible,summary:focus-visible,a:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

/* login */
.login{min-height:100svh;display:grid;place-items:center;padding:24px 16px}
.login form{width:100%;max-width:360px;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:24px 20px;display:flex;flex-direction:column;gap:14px}
.login .logo{width:56px;height:56px;border-radius:14px;margin:0 auto}
.login h1{text-align:center}
.login .sub{text-align:center}

/* header + nav */
.top{position:sticky;top:0;z-index:5;background:color-mix(in srgb,var(--bg) 92%,transparent);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);
  border-bottom:1px solid var(--line);padding:calc(8px + env(safe-area-inset-top)) max(16px,env(safe-area-inset-right)) 8px max(16px,env(safe-area-inset-left))}
.top .in{max-width:760px;margin:0 auto;display:flex;align-items:center;gap:10px}
.top .who{font-weight:800;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pill{font-size:.78rem;padding:2px 10px;border-radius:999px;background:var(--line);color:var(--muted);white-space:nowrap;border:0;cursor:pointer}
.pill.ok{background:var(--accent-soft);color:var(--accent)}
.pill.busy{background:var(--accent-soft);color:var(--accent)}
.pill.warn{background:var(--warn-soft);color:var(--warn)}
.iconbtn{width:40px;height:40px;border-radius:10px;border:1px solid var(--line);background:var(--surface);cursor:pointer;display:grid;place-items:center;flex:none}
.iconbtn svg{width:20px;height:20px}
nav.tabs{position:fixed;bottom:0;left:0;right:0;z-index:6;background:var(--surface);border-top:1px solid var(--line);
  padding:4px max(8px,env(safe-area-inset-right)) calc(4px + env(safe-area-inset-bottom)) max(8px,env(safe-area-inset-left))}
nav.tabs .in{max-width:760px;margin:0 auto;display:flex}
nav.tabs button{flex:1;min-width:0;border:0;background:none;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:0;padding:6px 2px;
  color:var(--muted);font-size:.72rem;font-weight:600;border-radius:10px;touch-action:manipulation}
nav.tabs button svg{width:22px;height:22px}
nav.tabs button[aria-current="page"]{color:var(--accent)}

/* shared bits */
.card{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:16px}
.card>h2:first-child{margin-top:0}
.btn{border:1px solid var(--accent);background:var(--accent);color:var(--on);font-weight:700;padding:10px 18px;border-radius:10px;cursor:pointer;min-height:44px;touch-action:manipulation}
.btn.ghost{background:none;color:var(--accent)}
.btn.danger{background:none;border-color:var(--bad);color:var(--bad)}
.btn.small{min-height:36px;padding:5px 12px;font-size:.88rem}
.btn:disabled{opacity:.55;cursor:default}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.grid2{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px}
.field{display:flex;flex-direction:column;gap:4px;min-width:0}
.field>span{font-size:.85rem;font-weight:600;color:var(--muted)}
.field input,.field select,.field textarea{width:100%;border:1px solid var(--line);background:var(--bg);border-radius:10px;padding:9px 12px;min-height:44px}
.field textarea{min-height:110px;resize:vertical;line-height:1.7}
.field small{color:var(--muted);font-size:.8rem}
.check{display:flex;align-items:center;gap:8px;font-size:.92rem;cursor:pointer}
.check input{width:20px;height:20px;accent-color:var(--accent)}
.opts{display:flex;flex-wrap:wrap;gap:6px}
.opts label{cursor:pointer;position:relative}
/* the real radio sits invisibly on top of its chip; anchored to the label so Safari can't push it off-screen and widen the page */
.opts input{position:absolute;inset:0;width:100%;height:100%;margin:0;opacity:0;pointer-events:none}
.opts span{display:inline-block;border:1px solid var(--line);background:var(--bg);padding:6px 13px;border-radius:999px;font-size:.9rem}
.opts input:checked+span{border-color:var(--accent);background:var(--accent-soft);color:var(--accent);font-weight:700}
.opts input:focus-visible+span{outline:2px solid var(--accent);outline-offset:2px}
.upl{position:relative;overflow:hidden;display:inline-flex;align-items:center}
.upl input{position:absolute;inset:0;width:100%;height:100%;margin:0;opacity:0;cursor:pointer}
.upl.busy{pointer-events:none;opacity:.7}
.err{color:var(--bad);font-size:.9rem;margin:0}
.okmsg{color:var(--accent);font-size:.9rem;margin:0}
.empty{text-align:center;padding:28px 16px;color:var(--muted)}
.empty .btn{margin-top:12px}
.list{display:flex;flex-direction:column;gap:8px;margin:0;padding:0;list-style:none}
.list li{display:flex;gap:10px;align-items:center;border:1px solid var(--line);border-radius:10px;padding:8px 10px;background:var(--bg)}
.list li{flex-wrap:wrap}
.list li .grow{flex:1 1 140px;min-width:0;overflow-wrap:anywhere}
.list li .grow small{display:block;color:var(--muted);font-size:.8rem}
.seg{display:flex;border:1px solid var(--line);border-radius:10px;overflow:hidden}
.seg button{flex:1;border:0;background:var(--surface);padding:8px 10px;cursor:pointer;font-weight:600;font-size:.9rem}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--on)}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(84px + env(safe-area-inset-bottom));z-index:9;background:var(--fg);color:var(--bg);
  padding:9px 16px;border-radius:10px;font-size:.9rem;max-width:calc(100% - 32px);box-shadow:0 4px 16px rgba(0,0,0,.2)}
dialog{border:1px solid var(--line);border-radius:14px;background:var(--surface);color:var(--fg);padding:18px;width:min(420px,calc(100% - 32px))}
dialog::backdrop{background:rgba(0,0,0,.45)}
dialog form{display:flex;flex-direction:column;gap:12px}
.menuitem{display:block;width:100%;text-align:right;border:0;border-top:1px solid var(--line);background:none;padding:12px 4px;cursor:pointer;font-weight:600}
.menuitem:first-of-type{border-top:0}
.loading{text-align:center;color:var(--muted);padding:40px 0}

/* today (same shape as the original daily plan) */
.wk{display:flex;align-items:center;gap:6px}
.wk .iconbtn{width:32px;height:52px;font-size:1.3rem;line-height:1}
.wkdays{flex:1;display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px}
.wkdays button{border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:5px 0 6px;display:flex;flex-direction:column;align-items:center;cursor:pointer;min-width:0;line-height:1.35;touch-action:manipulation}
.wkdays small{font-size:.72rem;color:var(--muted)}
.wkdays b{font-size:1rem;font-weight:700}
.wkdays button.today{border-color:var(--accent)}
.wkdays button.today b{color:var(--accent)}
.wkdays button[aria-pressed="true"]{background:var(--accent);border-color:var(--accent)}
.wkdays button[aria-pressed="true"] small,.wkdays button[aria-pressed="true"] b{color:var(--on)}
.wkdays .dot{width:5px;height:5px;border-radius:50%;background:var(--accent);margin-top:2px}
.wkdays .dot.none{background:transparent}
.wkdays .dot.skip{background:var(--warn)}
.wkdays button[aria-pressed="true"] .dot:not(.none){background:var(--on)}
.days{display:flex;flex-wrap:wrap;gap:8px}
.days button{font-weight:600;border:1px solid var(--line);background:var(--surface);
  padding:7px 14px;border-radius:999px;cursor:pointer;touch-action:manipulation}
.days button small{font-weight:500;opacity:.8;font-size:.75rem}
.days button[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--on)}
.bar{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.progress{flex:1;min-width:160px;height:8px;background:var(--line);border-radius:4px;overflow:hidden}
.progress i{display:block;height:100%;background:var(--accent);width:0;transition:width .3s}
.count{font-variant-numeric:tabular-nums;color:var(--muted);font-size:.9rem}
.reset{font-size:.85rem;background:none;border:0;color:var(--muted);text-decoration:underline;cursor:pointer;padding:6px 0}
.timeline{display:flex;flex-direction:column;background:var(--surface);border:1px solid var(--line);border-radius:12px}
.step{display:grid;grid-template-columns:34px 1fr;gap:10px;padding:14px;border-top:1px solid var(--line)}
.step:first-child{border-top:0}
.tick{width:28px;height:28px;border-radius:7px;border:2px solid var(--line);background:none;cursor:pointer;display:grid;place-items:center;color:var(--on);font-size:15px;padding:0;margin-top:2px;touch-action:manipulation}
.step.done .tick{background:var(--accent);border-color:var(--accent)}
.step.done .title{color:var(--done);text-decoration:line-through}
.title{font-weight:700;min-width:0}
.tag{display:inline-block;font-size:.75rem;font-weight:600;padding:1px 8px;border-radius:999px;background:var(--accent-soft);color:var(--accent);margin-inline-start:6px;vertical-align:middle;text-decoration:none}
.tag.warn{background:var(--warn-soft);color:var(--warn)}
.hour{display:inline-block;min-width:3.6em;font-variant-numeric:tabular-nums;color:var(--accent);font-weight:800;margin-inline-end:6px}
.step.done .hour{color:var(--done)}
.detail{color:var(--muted);font-size:.9rem;margin-top:2px}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.chip{font-size:.85rem;border:1px solid var(--line);background:var(--bg);padding:5px 12px;border-radius:999px;cursor:pointer;touch-action:manipulation}
.chip[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft);color:var(--accent);font-weight:700}
.menu-detail{font-size:.88rem;margin-top:6px}
.water{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.water button{width:30px;height:36px;border:2px solid var(--line);border-radius:4px 4px 8px 8px;background:none;cursor:pointer;padding:0;touch-action:manipulation}
.water button.full{background:var(--accent);border-color:var(--accent)}
.ex{list-style:none;margin:8px 0 0;padding:0;display:flex;flex-direction:column;gap:8px}
.ex li{border:1px solid var(--line);border-radius:8px;padding:8px 10px;background:var(--bg)}
.exrow{display:flex;gap:8px;align-items:flex-start}
.extick{flex:none;width:24px;height:24px;border-radius:6px;border:2px solid var(--line);background:var(--surface);cursor:pointer;color:var(--on);font-size:13px;padding:0;display:grid;place-items:center;margin-top:3px;touch-action:manipulation}
.exdone .extick{background:var(--accent);border-color:var(--accent)}
.exdone .name{color:var(--done);text-decoration:line-through}
.ex .grp{font-size:.75rem;font-weight:700;color:var(--accent);display:block}
.ex .name{font-weight:600}
.ex .reps{font-variant-numeric:tabular-nums;color:var(--muted);font-size:.85rem}
.ex .pair{border-inline-start:3px solid var(--accent);padding-inline-start:8px;display:flex;flex-direction:column;gap:6px}
.drop{color:var(--warn);font-size:.8rem;font-weight:600}

/* body stats + plan reference */
.stats{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:8px;margin-top:10px}
.stats div{background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:8px 10px;display:flex;flex-direction:column;min-width:0}
.stats span{font-size:.78rem;color:var(--muted)}
.stats b{font-size:1.15rem;font-weight:800;font-variant-numeric:tabular-nums}
.stats em{font-style:normal;font-size:.75rem;color:var(--muted)}
.stats .flag{border-color:var(--warn);background:var(--warn-soft)}
.stats .flag em{color:var(--warn)}
.goal{margin:12px 0 4px;padding:10px 12px;border-radius:8px;background:var(--accent-soft);font-size:.92rem}
.cheat{margin-top:8px;font-size:.88rem;display:flex;flex-direction:column;gap:6px}
.cheat ul{margin:0;padding-inline-start:20px}
section.card details,.card details{border-top:1px solid var(--line);padding:10px 0}
.card details:first-of-type{border-top:0}
summary{cursor:pointer;font-weight:700}
table{border-collapse:collapse;width:100%;font-size:.88rem}
td,th{border-bottom:1px solid var(--line);padding:6px 4px;text-align:right;vertical-align:top}
th{color:var(--muted);font-weight:600}
.tw{overflow-x:auto}
ul.plain{margin:6px 0 0;padding-inline-start:20px}
.note{background:var(--warn-soft);border-radius:10px;padding:12px 14px;font-size:.9rem}
.note b{color:var(--warn)}
.chart{width:100%;height:auto;display:block;margin-top:8px}
.chart text{font-family:var(--font);font-size:11px;fill:var(--muted)}
/* «غذاها»: the diet food explorer */
:root{--t-iran:linear-gradient(135deg,#fff4dc,#ffe2a8);--t-west:linear-gradient(135deg,#e8efff,#cddcff);--t-sport:linear-gradient(135deg,#ddf7ea,#b8ecd3);--m-p:#3355ff;--m-c:#f0a020;--m-f:#14a874}
:root[data-theme="dark"]{--t-iran:linear-gradient(135deg,#3a2c12,#4d3711);--t-west:linear-gradient(135deg,#17223f,#203063);--t-sport:linear-gradient(135deg,#123326,#17442f);--m-p:#6f8bff;--m-c:#f5b86b;--m-f:#3ccf95}
@media (prefers-color-scheme:dark){:root[data-theme="auto"]{--t-iran:linear-gradient(135deg,#3a2c12,#4d3711);--t-west:linear-gradient(135deg,#17223f,#203063);--t-sport:linear-gradient(135deg,#123326,#17442f);--m-p:#6f8bff;--m-c:#f5b86b;--m-f:#3ccf95}}
.hscroll{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;-webkit-overflow-scrolling:touch;padding:1px}
.hscroll::-webkit-scrollbar{display:none}
.hscroll .chip{flex:none;white-space:nowrap}
.flabel{font-size:.78rem;color:var(--muted);margin:0 0 4px}
.fsearch{width:100%;border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:10px 14px;min-height:46px}
.fgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.fcard{background:var(--surface);border:1px solid var(--line);border-radius:14px;overflow:hidden;text-align:right;padding:0;cursor:pointer;display:flex;flex-direction:column;min-width:0;touch-action:manipulation}
.fcard:active{transform:scale(.98)}
.fthumb{aspect-ratio:4/3;display:grid;place-items:center;position:relative}
.fthumb .fe{font-size:2.7rem;line-height:1}
.t-iran{background:var(--t-iran)}.t-west{background:var(--t-west)}.t-sport{background:var(--t-sport)}
.fbadge{position:absolute;top:8px;right:8px;background:color-mix(in srgb,var(--surface) 88%,transparent);color:var(--fg);font-size:.72rem;font-weight:700;padding:1px 8px;border-radius:999px}
.fbody{padding:8px 10px 10px;display:flex;flex-direction:column;gap:1px;min-width:0}
.fbody b{font-size:.92rem;line-height:1.5}
.fbody small{font-size:.76rem;color:var(--muted);line-height:1.5}
.fbody .kc{color:var(--accent);font-weight:700}
.fhero{border-radius:16px;height:150px;display:grid;place-items:center}
.fhero span{font-size:4.2rem;line-height:1}
.macro{display:flex;height:10px;border-radius:5px;overflow:hidden;margin:10px 0 4px}
.macro i{display:block;height:100%}
.mkey{display:flex;gap:12px;flex-wrap:wrap;font-size:.8rem;color:var(--muted)}
.mkey span::before{content:"";display:inline-block;width:9px;height:9px;border-radius:3px;margin-inline-end:4px;background:var(--c)}
.dv{display:block;height:4px;border-radius:2px;background:var(--line);margin-top:4px;overflow:hidden}
.dv i{display:block;height:100%;background:var(--accent)}
.fthumb,.fhero,.sgimg,.himg{position:relative;overflow:hidden}
img.ph{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:block}
.fhero{height:210px}
.fbadge{z-index:1;display:inline-flex;align-items:center;gap:4px}
.fbadge svg{width:12px;height:12px}
.fseg button{font-size:.88rem;padding:9px 6px}
.seg.small button{padding:6px 14px;font-size:.84rem;flex:none}
.seg.small{display:inline-flex;align-self:flex-start}
.ctiles{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
.ctile{position:relative;aspect-ratio:1;border-radius:16px;overflow:hidden;border:0;padding:0;cursor:pointer;background:var(--accent-soft);outline:2px solid transparent;outline-offset:2px;touch-action:manipulation}
.ctile>span{position:absolute;inset:auto 0 0 0;padding:18px 4px 7px;background:linear-gradient(transparent,rgba(8,12,30,.72));color:#fff;font-weight:700;font-size:.84rem;text-align:center;z-index:1}
.ctile.all{background:linear-gradient(140deg,var(--accent),#8aa0ff);display:grid;place-items:center}
.ctile.all svg{width:28px;height:28px;color:#fff;margin-bottom:16px}
.ctile.all>span{background:none}
.ctile[aria-pressed="true"]{outline-color:var(--accent)}
.ctile[aria-pressed="false"] img{filter:saturate(.85)}
.sortbar{display:flex;flex-direction:column;gap:6px}
.spill{display:inline-flex;align-items:center;gap:6px;flex:none;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:7px 14px 7px 12px;font-size:.85rem;font-weight:600;cursor:pointer;white-space:nowrap;touch-action:manipulation}
.spill svg{width:16px;height:16px;color:var(--accent)}
.spill[aria-pressed="true"]{background:var(--accent);color:var(--on);border-color:var(--accent)}
.spill[aria-pressed="true"] svg{color:var(--on)}
.sgcard{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px;display:flex;flex-direction:column;gap:8px}
.sghead{display:flex;align-items:baseline;gap:4px;flex-wrap:wrap;font-size:.92rem}
.sghead .sub{font-size:.78rem}
.sgrow{display:grid;grid-template-columns:92px 1fr;gap:12px;align-items:center;border:0;background:none;padding:0;text-align:right;cursor:pointer;color:inherit}
.sgrow b{display:block;font-size:.95rem}
.sgrow small{display:flex;align-items:center;gap:4px;flex-wrap:wrap;color:var(--muted);font-size:.8rem}
.sgrow small svg{width:12px;height:12px}

<body>
<div id="login" class="login" hidden>
  <form id="loginForm" autocomplete="on" novalidate>
    <img class="logo" src="icon-180.png" alt="">
    <h1>روتین من</h1>
    <p class="sub">برنامه تمرین، رژیم و خواب</p>
    <label class="field"><span>نام کاربری</span><input id="lu" name="username" autocomplete="username" autocapitalize="none" spellcheck="false" required></label>
    <label class="field"><span>رمز عبور</span><input id="lp" name="password" type="password" autocomplete="current-password" required></label>
    <label class="check"><input id="lr" type="checkbox" checked> این دستگاه یادش بمونه</label>
    <p id="lerr" class="err" role="alert" hidden></p>
    <button class="btn" id="lbtn" type="submit">ورود</button>
  </form>
</div>

<div id="app" hidden>
  <header class="top"><div class="in">
    <div class="who" id="who"></div>
    <button class="pill" id="status" type="button"></button>
    <button class="iconbtn" id="menuBtn" type="button" aria-label="تنظیمات"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 7h16M4 12h16M4 17h16"/></svg></button>
  </div></header>
  <main class="wrap" id="view"></main>
  <nav class="tabs" aria-label="بخش‌ها"><div class="in" id="tabs"></div></nav>
</div>

<dialog id="dlg"></dialog>
<div class="toast" id="toast" role="status" hidden></div>

<script>
"use strict";
// ---------- the server: leon-gold-server serves this page at /gym/ and its API at /api/gym/* on the same address
const API = location.pathname.startsWith("/gym") ? "/api/gym/" : "https://api.leongold.net/api/gym/";

// ---------- small helpers
const $ = (s, r = document) => r.querySelector(s);
const FA = "۰۱۲۳۴۵۶۷۸۹";
const faT = s => String(s).replace(/\d/g, d => FA[d]);
const fa = (n, d = 1) => n == null || !isFinite(n) ? "" : Number(n).toLocaleString("fa-IR", {maximumFractionDigits: d});
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;"}[c]));
const toEn = s => String(s ?? "").replace(/[۰-۹]/g, d => FA.indexOf(d)).replace(/[٠-٩]/g, d => "٠١٢٣٤٥٦٧٨٩".indexOf(d));
const num = s => { if (s == null || s === "") return null; const v = parseFloat(toEn(s).replace(/[,٬]/g, "").replace("٫", ".")); return isFinite(v) ? v : null; };
const tm = s => { if (!s) return null; const [h, m] = toEn(s).split(":").map(Number); return isFinite(h) ? h * 60 + (m || 0) : null; };
const hm = m => { m = ((Math.round(m) % 1440) + 1440) % 1440; return faT(Math.floor(m / 60) + ":" + String(m % 60).padStart(2, "0")); };
const r15 = m => Math.round(m / 15) * 15;
const localDate = (d = new Date()) => d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0") + "-" + String(d.getDate()).padStart(2, "0");
const faDate = iso => { try { return new Date(iso + "T12:00:00").toLocaleDateString("fa-IR", {year: "numeric", month: "long", day: "numeric"}); } catch (e) { return iso; } };
const rid = () => Array.from(crypto.getRandomValues(new Uint8Array(9)), b => b.toString(16).padStart(2, "0")).join("");
const LS = {
  get(k, st = localStorage) { try { return JSON.parse(st.getItem(k)); } catch (e) { return null; } },
  set(k, v, st = localStorage) { try { st.setItem(k, JSON.stringify(v)); } catch (e) {} },
  del(k) { try { localStorage.removeItem(k); sessionStorage.removeItem(k); } catch (e) {} }
};
function toast(msg) { const t = $("#toast"); t.textContent = msg; t.hidden = false; clearTimeout(toast.t); toast.t = setTimeout(() => t.hidden = true, 3200); }

// ---------- api calls (a 401 means the session ended: back to the login screen)
let S = null, STORE = localStorage;
async function api(path, {method = "GET", body, raw, type} = {}) {
  const h = {};
  if (S) h.Authorization = "Bearer " + S.token;
  if (raw) h["Content-Type"] = type; else if (body !== undefined) h["Content-Type"] = "application/json";
  const r = await fetch(API + path, {method, headers: h, body: raw || (body !== undefined ? JSON.stringify(body) : undefined), cache: "no-store"});
  if (r.status === 401 && S && path !== "logout") { toast("دوباره وارد شو"); logout(); throw new Error("login"); }
  return r;
}
async function apiJSON(path, opt) {
  const r = await api(path, opt), j = await r.json().catch(() => ({}));
  if (!r.ok && r.status !== 409) throw Object.assign(new Error(j.error || "http " + r.status), {status: r.status});
  j.status = r.status; return j;
}

// ---------- the user's data: one JSON document on the server, merged section by section with this device's copy
// sections win by newest edit; the two plans are separate so one device's new routine never drops the other plan;
// body and files are lists merged by id, with deletions remembered in d.del
const SECS = ["profile", "diet", "supps", "train", "quiz", "plans.custom", "plans.generated", "active", "notify"], LISTS = ["body", "files"];
const getP = (o, p) => p.split(".").reduce((x, k) => x && x[k], o);
const setP = (o, p, v) => { const ks = p.split("."), last = ks.pop(); const t = ks.reduce((x, k) => x[k] = x[k] || {}, o); if (v === undefined) delete t[last]; else t[last] = v; };
let data = null, rev = 0, dirty = false, edits = 0, busy = false, ready = false, syncTimer = null, status = "";
function normalize(d) {
  d = d && typeof d === "object" ? d : {};
  d.v = 1; d._t = d._t || {}; d.days = d.days || {};
  d.profile = d.profile || {}; d.body = d.body || []; d.diet = d.diet || {}; d.diet.menus = d.diet.menus || {};
  d.supps = d.supps || []; d.train = d.train || {}; d.quiz = d.quiz || {}; d.plans = d.plans || {}; d.files = d.files || []; d.del = d.del || {}; d.notify = d.notify || {};
  for (const l of LISTS) d[l].forEach(x => { if (!x.id) x.id = x.date || rid(); });
  if (!d.active || !d.plans[d.active]) d.active = d.plans.custom ? "custom" : "generated";
  return d;
}
function merge(a, b) {
  const out = {v: 1, _t: {}, days: {}, plans: {}, del: {...b.del, ...a.del}};
  for (const s of SECS) { const ta = a._t[s] || 0, tb = b._t[s] || 0; setP(out, s, getP(ta >= tb ? a : b, s)); if (ta || tb) out._t[s] = Math.max(ta, tb); }
  for (const l of LISTS) {
    const m = new Map(); for (const x of [...b[l], ...a[l]]) if (!out.del[x.id]) m.set(x.id, x);
    out[l] = [...m.values()];
  }
  for (const d of new Set([...Object.keys(a.days), ...Object.keys(b.days)])) {
    const x = a.days[d], y = b.days[d]; out.days[d] = !x ? y : !y ? x : ((x._t || 0) >= (y._t || 0) ? x : y);
  }
  return normalize(out);
}
function newer(a, b) {
  if (SECS.some(s => (a._t[s] || 0) > (b._t[s] || 0))) return true;
  if (Object.keys(a.del).some(id => !b.del[id])) return true;
  if (LISTS.some(l => a[l].some(x => !b[l].some(y => y.id === x.id)))) return true;
  return Object.keys(a.days).some(d => !b.days[d] || (a.days[d]._t || 0) > (b.days[d]._t || 0));
}
function dropItem(list, id) { data[list] = data[list].filter(x => x.id !== id); data.del[id] = Date.now(); changed(); }
const cacheKey = () => "gym.d." + S.user;
function saveCache() { LS.set(cacheKey(), {data, rev, dirty}); }
function touch(sec) { data._t[sec] = Date.now(); changed(); }
function changed() { dirty = true; edits++; saveCache(); setStatus(); clearTimeout(syncTimer); syncTimer = setTimeout(sync, 1200); }
function absorb(j) {
  rev = j.rev;
  if (!j.data) { dirty = true; return; }
  const rd = normalize(j.data), before = JSON.stringify(data);
  dirty = newer(data, rd);
  data = merge(data, rd); saveCache();
  if (JSON.stringify(data) !== before) render(true);
}
async function sync() {
  clearTimeout(syncTimer);
  if (!S) return;
  if (busy) { syncTimer = setTimeout(sync, 2000); return; }
  busy = true; status = "busy"; setStatus();
  try {
    const j = await apiJSON("data?rev=" + rev);
    if (!j.same) absorb(j);
    for (let i = 0; dirty && i < 4; i++) {
      const e0 = edits, r = await apiJSON("data", {method: "PUT", body: {base: rev, data}});
      if (r.status === 409) { absorb(r); continue; }
      rev = r.rev; dirty = edits !== e0; saveCache();
    }
    status = dirty ? "err" : "ok";
  } catch (e) { status = navigator.onLine === false ? "offline" : "err"; }
  finally {
    busy = false;
    if (!ready && S) { ready = true; render(); }
    setStatus();
    if (status === "ok") schedulePush();
  }
}
function setStatus() {
  const p = $("#status"); if (!p) return;
  let t, c;
  if (status === "busy") { t = "در حال همگام‌سازی…"; c = "busy"; }
  else if (status === "offline") { t = "آفلاین"; c = "warn"; }
  else if (status === "err") { t = "همگام نشد، دوباره"; c = "warn"; }
  else if (dirty) { t = "در صف ارسال"; c = "busy"; }
  else { t = "همگام ✓"; c = "ok"; }
  p.textContent = t; p.className = "pill " + c;
}

// ---------- session
async function startSession(s) {
  S = s;
  const c = LS.get("gym.d." + s.user);
  data = normalize(c && c.data); rev = c ? c.rev || 0 : 0; dirty = !!(c && c.dirty); ready = !!c; status = "busy";
  $("#login").hidden = true; $("#app").hidden = false;
  if (!TAB || !tabsFor().some(t => t[0] === TAB)) TAB = "today";
  render();
  try { const me = await apiJSON("me"); AI_ON = !!me.ai; if (S && me.role !== S.role) { S.role = me.role; LS.set("gym.s", S, STORE); render(); } } catch (e) {}
  sync();
}
async function login(user, pass, remember) {
  const r = await fetch(API + "login", {method: "POST", headers: {"Content-Type": "application/json"}, body: JSON.stringify({u: user, p: pass}), cache: "no-store"});
  if (r.status === 401) throw new Error("bad");
  if (r.status === 429) throw new Error("many");
  if (!r.ok) throw new Error("net");
  const j = await r.json(), s = {user: j.user, role: j.role, token: j.token};
  STORE = remember ? localStorage : sessionStorage;
  LS.del("gym.s"); LS.set("gym.s", s, STORE);
  await startSession(s);
}
function logout() {
  // this phone stops getting this user's reminders
  const ep = LS.get("gym.push.ep");
  if (S && ep) { api("push/unsub", {method: "POST", body: {endpoint: ep}}).catch(() => {}); LS.del("gym.push.ep"); }
  if (S) api("logout", {method: "POST"}).catch(() => {});
  LS.del("gym.s");
  // keep the local copy if something hasn't reached the server yet
  if (S && !dirty) try { localStorage.removeItem("gym.d." + S.user); } catch (e) {}
  S = data = null; dirty = false; clearTimeout(syncTimer);
  $("#app").hidden = true; $("#login").hidden = false; $("#lp").value = ""; $("#view").innerHTML = "";
}
$("#loginForm").addEventListener("submit", async ev => {
  ev.preventDefault();
  const u = $("#lu").value, p = $("#lp").value, err = $("#lerr"), b = $("#lbtn");
  err.hidden = true;
  if (!u.trim() || !p) { err.textContent = "نام کاربری و رمز رو بنویس."; err.hidden = false; return; }
  b.disabled = true; b.textContent = "در حال ورود…";
  try { await login(u, p, $("#lr").checked); }
  catch (e) {
    err.textContent = e.message === "bad" ? "نام کاربری یا رمز درست نیست." : e.message === "many" ? "تلاش اشتباه زیاد بود؛ ۱۵ دقیقه دیگه امتحان کن." : "به اینترنت وصل نیستی یا سرور جواب نداد. دوباره امتحان کن.";
    err.hidden = false;
  } finally { b.disabled = false; b.textContent = "ورود"; }
});

// ---------- tabs
const ICONS = {
  today: '<path d="M8 2v4M16 2v4M3 10h18M5 4h14a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2Z"/><path d="m9 16 2 2 4-4"/>',
  plan: '<path d="M6.5 6.5h11M6.5 17.5h11M3 9.5v5M21 9.5v5M6.5 4v16M17.5 4v16"/>',
  me: '<circle cx="12" cy="7" r="4"/><path d="M5 21a7 7 0 0 1 14 0"/>',
  quiz: '<circle cx="12" cy="12" r="10"/><path d="M9.1 9a3 3 0 0 1 5.8 1c0 2-3 3-3 3M12 17h.01"/>',
  admin: '<path d="M12 2 4 5v6c0 5 3.4 9.7 8 11 4.6-1.3 8-6 8-11V5l-8-3Z"/>',
  foods: '<path d="M7 2v20M4 2v6a3 3 0 0 0 6 0V2M18 22V2c-2.2 1.4-3.5 4-3.5 7.5S15.8 14 18 14"/>'
};
let TAB = "today";
function tabsFor() {
  const t = [["today", "امروز"], ["plan", "برنامه"], ["foods", "غذاها"], ["me", "پرونده"], ["quiz", "پرسش‌ها"]];
  if (S && S.role === "admin") t.push(["admin", "مدیریت"]);
  return t;
}
function renderTabs() {
  $("#tabs").innerHTML = tabsFor().map(([k, l]) => `<button type="button" data-tab="${k}" ${TAB === k ? 'aria-current="page"' : ""}><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${ICONS[k]}</svg>${l}</button>`).join("");
  $("#tabs").querySelectorAll("button").forEach(b => b.onclick = () => { TAB = b.dataset.tab; render(); scrollTo(0, 0); });
}
function render(fromRemote) {
  if (!S || !data) return;
  const v = $("#view");
  // don't wipe a form the user is typing in when remote changes arrive
  if (fromRemote && v.contains(document.activeElement) && /INPUT|TEXTAREA|SELECT/.test(document.activeElement.tagName)) return;
  $("#who").textContent = data.profile.name || S.user;
  renderTabs(); setStatus();
  if (!ready && TAB !== "admin") { v.innerHTML = '<p class="loading">در حال دریافت اطلاعات…</p>'; return; }
  ({today: viewToday, plan: viewPlan, foods: viewFoods, me: viewMe, quiz: viewQuiz, admin: viewAdmin})[TAB](v);
}
$("#status").onclick = () => sync();
// look: light (default), dark, or like the phone; remembered on this device
const THEMES = [["light", "روشن"], ["dark", "تیره"], ["auto", "مثل گوشی"]];
function applyTheme(t) {
  document.documentElement.dataset.theme = t;
  try { localStorage.setItem("gym.theme", t); } catch (e) {}
  const m = document.querySelector('meta[name="theme-color"]');
  if (m) m.content = getComputedStyle(document.documentElement).getPropertyValue("--bg").trim();
}
applyTheme(document.documentElement.dataset.theme || "light");
matchMedia("(prefers-color-scheme: dark)").addEventListener?.("change", () => applyTheme(document.documentElement.dataset.theme));
$("#menuBtn").onclick = () => {
  const d = $("#dlg"), cur = document.documentElement.dataset.theme;
  d.innerHTML = `<h2>${esc(S.user)}</h2>
    <div style="padding:4px 0 12px"><div class="sub" style="margin-bottom:6px">ظاهر برنامه</div>
      <div class="seg" role="group" aria-label="ظاهر">${THEMES.map(([k, l]) => `<button type="button" data-theme="${k}" aria-pressed="${cur === k}">${l}</button>`).join("")}</div></div>
    <button class="menuitem" data-a="push" type="button">یادآورها (نوتیفیکیشن)</button>
    <button class="menuitem" data-a="pass" type="button">عوض کردن رمز</button>
    <button class="menuitem" data-a="sync" type="button">همگام‌سازی الان</button>
    <button class="menuitem" data-a="out" type="button" style="color:var(--bad)">خروج از حساب</button>
    <button class="menuitem" data-a="x" type="button" style="color:var(--muted)">بستن</button>`;
  d.querySelectorAll("[data-theme]").forEach(b => b.onclick = () => {
    applyTheme(b.dataset.theme);
    d.querySelectorAll("[data-theme]").forEach(x => x.setAttribute("aria-pressed", String(x === b)));
  });
  d.querySelectorAll(".menuitem").forEach(b => b.onclick = () => {
    d.close();
    if (b.dataset.a === "push") pushDialog();
    if (b.dataset.a === "pass") changePassDialog();
    if (b.dataset.a === "sync") sync();
    if (b.dataset.a === "out") { if (dirty && !confirm("بعضی تغییرها هنوز ارسال نشده. باز هم خارج می‌شی؟")) return; logout(); }
  });
  d.showModal();
};

// ---------- plans: a "custom" plan (hand-made, e.g. from a doctor) or a "generated" one from the questionnaire
const ORD = ["", "اول", "دوم", "سوم", "چهارم", "پنجم", "ششم"];
const WD = ["یکشنبه", "دوشنبه", "سه‌شنبه", "چهارشنبه", "پنجشنبه", "جمعه", "شنبه"];
const WEEK = [6, 0, 1, 2, 3, 4, 5];
const plan = () => data.plans[data.active] || data.plans.custom || data.plans.generated || null;
function isTrainDay(p, k) { return p.byDay ? !!(p.byDay[k] || []).some(s => s.workout) : k !== "rest"; }
function stepsOf(p, k, iso) {
  if (p.byDay) return p.byDay[k] || [];
  const train = isTrainDay(p, k), friRest = (iso ? wdOf(iso) : new Date().getDay()) === 5 && !train;
  return p.steps.filter(s => (!s.on || (s.on === "train") === train) && (!s.when || (s.when === "friRest") === friRest));
}
function menusFor(p, cat) { const m = data.diet.menus[cat]; return m && m.length ? m : (p.menus && p.menus[cat]) || DEFAULT_MENUS[cat] || []; }
function workoutOf(p, s, k) { return p.workouts[s.workout === true ? k : s.workout]; }
function exList(p, wk, w) {
  const list = [{n: "گرم کردن", r: w.warm || "حداکثر توان"}].concat(w.ex, [{n: "سرد کردن", r: w.cool || "حداکثر توان"}]);
  const keys = [];
  list.forEach((e, i) => { if (e.g) e.items.forEach((_, j) => keys.push(wk + "-" + i + "-" + j)); else keys.push(wk + "-" + i); });
  return {list, keys};
}

// ---------- view: today
function dayRec(date) { return data.days[date] || {done: {}, menu: {}, water: 0, ex: {}}; }
const wdOf = iso => new Date(iso + "T12:00:00").getDay();
const WD_SHORT = ["ی", "د", "س", "چ", "پ", "ج", "ش"];
// the date shown in «امروز»: each date keeps its own ticks; it goes back to today when the real day changes
let VIEW_DATE = null, VIEW_FOR = null;
const hasTicks = r => !!r && (Object.values(r.done || {}).some(Boolean) || Object.values(r.ex || {}).some(Boolean) || Object.keys(r.menu || {}).length > 0 || r.water > 0);
function viewToday(v) {
  const p = plan();
  if (!p) {
    v.innerHTML = `<div class="card empty"><h2>هنوز برنامه‌ای نداری</h2><p class="sub">چند سؤال کوتاه رو جواب بده تا روتین روزانه‌ات (ساعت باشگاه، وعده‌ها، آب و خواب) ساخته بشه.</p><button class="btn" type="button" id="goQuiz">شروع پرسش‌ها</button></div>`;
    $("#goQuiz").onclick = () => { TAB = "quiz"; render(); };
    return;
  }
  const today = localDate();
  if (VIEW_FOR !== today) { VIEW_DATE = today; VIEW_FOR = today; }
  const date = VIEW_DATE, rec = dayRec(date), wd = wdOf(date), isToday = date === today, past = date < today;
  const thisDay = isToday ? "امروز" : "این روز";
  const defKey = String(p.week[wd]);
  const k = rec.day != null && p.dayKeys.some(d => d[0] === String(rec.day)) ? String(rec.day) : defKey;
  const save = () => { rec._t = Date.now(); data.days[date] = rec; changed(); viewToday(v); };
  rec.done = rec.done || {}; rec.menu = rec.menu || {}; rec.ex = rec.ex || {}; rec.water = rec.water || 0;
  // a skipped gym day shows as rest (the hand-made plan's own rest day, or this day without the session)
  const steps = rec.skip && p.byDay ? stepsOf(p, k, date).filter(s => !s.workout && !["go", "pre", "post"].includes(s.id)) : stepsOf(p, k, date);
  const trainToday = steps.some(s => s.workout);
  const moved = rec.moved && data.days[rec.moved.from] ? rec.moved : null;
  const sat = addDays(date, -((wd + 1) % 7)), week = Array.from({length: 7}, (_, i) => addDays(sat, i));

function weightChart(rows) {
  const pts = rows.filter(r => num(r.weight) != null);
  if (pts.length < 2) return "";
  const W = 600, H = 160, pad = 28, ws = pts.map(r => num(r.weight));
  const lo = Math.min(...ws) - 1, hi = Math.max(...ws) + 1;
  const x = i => pad + i * (W - 2 * pad) / (pts.length - 1), y = val => H - pad - (val - lo) / (hi - lo) * (H - 2 * pad);
  const line = pts.map((r, i) => (i ? "L" : "M") + x(i).toFixed(1) + " " + y(ws[i]).toFixed(1)).join(" ");
  return `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="نمودار وزن"><path d="${line}" fill="none" stroke="var(--accent)" stroke-width="2.5" stroke-linejoin="round"/>
    ${pts.map((r, i) => `<circle cx="${x(i)}" cy="${y(ws[i])}" r="4" fill="var(--accent)"/><text x="${x(i)}" y="${y(ws[i]) - 9}" text-anchor="middle">${fa(ws[i])}</text>`).join("")}</svg>`;
}

const PORTIONS = {fruit: [60, 0.5, 0.2, 15, 12], nut: [45, 1.5, 4, 1.5, 0.3]}; // one exchange unit «واحد»
const normFa = s => toEn(String(s || "")).replace(/[يى]/g, "ی").replace(/ك/g, "ک").replace(/[‌‏‎]/g, " ").replace(/\s+/g, " ").trim();
const FOOD_INDEX = FOODS.flatMap(f => f[0].map(a => [normFa(a), f])).sort((a, b) => b[0].length - a[0].length);
const WORDNUM = {"نصف": 0.5, "نیم": 0.5, "یک": 1, "دو": 2, "سه": 3, "چهار": 4, "پنج": 5};
// one menu line → {kcal, p, f, c, s, miss}
function nutrition(text) {
  const t = {kcal: 0, p: 0, f: 0, c: 0, s: 0, miss: 0, hit: 0};
  const add = (k, p, f, c, s, n) => { t.kcal += k * n; t.p += p * n; t.f += f * n; t.c += c * n; t.s += s * n; t.hit++; };
  const parts = normFa(text).replace(/\([^)]*\)/g, " ").split(/[،,+؛;]| و (?=\D)/);
  for (let seg of parts) {
    seg = seg.trim(); if (!seg) continue;
    let q = null;
    const r = seg.match(/(\d+(?:[.٫]\d+)?)\s*(?:تا|-)\s*(\d+(?:[.٫]\d+)?)/), n1 = seg.match(/\d+(?:[.٫]\d+)?(?:\/\d+)?/);
    if (r) q = (parseFloat(r[1].replace("٫", ".")) + parseFloat(r[2].replace("٫", "."))) / 2;
    else if (n1) q = n1[0].includes("/") ? n1[0].split("/").reduce((a, b) => +a / +b) : parseFloat(n1[0].replace("٫", "."));
    else { const w = Object.keys(WORDNUM).find(w => new RegExp("(^| )" + w + "( |$)").test(seg)); if (w) q = WORDNUM[w]; }
    if (/واحد/.test(seg)) {
      const pc = /مغز|آجیل/.test(seg) ? PORTIONS.nut : /میوه/.test(seg) ? PORTIONS.fruit : null;
      if (pc) { add(...pc, q ?? 1); continue; }
    }
    const hit = FOOD_INDEX.find(([a]) => (" " + seg + " ").includes(" " + a + " ") || seg.startsWith(a) || seg.includes(a));
    if (!hit) { if (q != null) t.miss++; continue; }
    const [, kcal, p, f, c, s, U] = hit[1];
    if (!kcal && !p) continue;
    q = q ?? 1;
    let g;
    if (/گرم|میلی ?لیتر|سی ?سی/.test(seg) && !/کیلو/.test(seg)) g = q;
    else if (/قاشق چای ?خوری|قاشق مربا ?خوری/.test(seg)) g = q * (U.s || 5);
    else if (/قاشق/.test(seg)) g = q * (U.t || 15);
    else if (/لیوان/.test(seg)) g = q * (U.l || 220);
    else if (/کاسه کوچک/.test(seg)) g = q * 150;
    else if (/کاسه/.test(seg)) g = q * 220;
    else if (/کف دست|برش|تکه/.test(seg)) g = q * (U.u && U.u <= 40 ? 30 : U.u || 100);
    else if (/اسکوپ|پیمانه/.test(seg)) g = q * (U.sc || 30);
    else if (/بشقاب/.test(seg)) g = q * 300;
    else if (U.u) g = q * U.u; // «عدد» or a bare number
    else g = q <= 20 ? q * 100 : q; // a dish with no unit: small numbers are portions, big ones grams
    add(kcal / 100, p / 100, f / 100, c / 100, s / 100, g);
  }
  return t;
}
const NUT_LINE = n => `حدود ${fa(Math.round(n.kcal / 5) * 5, 0)} کالری · پروتئین ${fa(n.p, 0)} · چربی ${fa(n.f, 0)} · کربو ${fa(n.c, 0)} · قند ${fa(n.s, 0)} گرم${n.miss ? " (بعضی موارد حساب نشد)" : ""}`;
const nutLine = text => { const n = nutrition(text); return n.hit ? NUT_LINE(n) : ""; };
// average and range of one meal's menu options
function mealNut(list) {
  const ns = list.map(m => nutrition(m[1])).filter(n => n.hit);
  if (!ns.length) return null;
  const avg = k => ns.reduce((a, n) => a + n[k], 0) / ns.length;
  return {kcal: avg("kcal"), p: avg("p"), f: avg("f"), c: avg("c"), s: avg("s"), lo: Math.min(...ns.map(n => n.kcal)), hi: Math.max(...ns.map(n => n.kcal))};
}
// a day of the active plan: the meals in it, summed (average of each meal's options, with the range)
function dayNut(p, k) {
  const tot = {kcal: 0, p: 0, f: 0, c: 0, s: 0, lo: 0, hi: 0, meals: 0};
  for (const st of stepsOf(p, k)) {
    if (!st.menu) continue;
    const m = mealNut(menusFor(p, st.menu)); if (!m) continue;
    for (const x of ["kcal", "p", "f", "c", "s", "lo", "hi"]) tot[x] += m[x];
    tot.meals++;
  }
  return tot.meals ? tot : null;
}

function recipeOf(name) { const r = RECIPES.find(([re]) => re.test(name || "")); return r ? r[1] : null; }
const recipeTime = r => r.prep + r.cook;
function recipeHTML(r, menuText) {
  const n = menuText ? nutLine(menuText) : "";
  return `<p class="sub" style="margin:0">آماده‌سازی ${fa(r.prep)} دقیقه${r.cook ? ` · پخت ${fa(r.cook)} دقیقه` : ""} · <b>جمعاً حدود ${fa(recipeTime(r))} دقیقه</b>${r.serves ? ` · برای ${esc(r.serves)}` : ""}</p>
    ${r.ahead ? `<p class="note" style="margin:0;padding:8px 12px">از قبل: ${esc(r.ahead)}</p>` : ""}
    ${menuText ? `<div class="goal" style="margin:0"><b>مقدار این وعده (منوی خودت):</b> ${esc(menuText)}${n ? `<div class="sub" style="margin:4px 0 0">${n}</div>` : ""}</div>` : ""}
    <div><b>مواد</b><ul class="plain">${r.ing.map(x => `<li>${esc(x)}</li>`).join("")}</ul></div>
    <div><b>طرز تهیه</b><ol style="list-style-type:persian;margin:6px 0 0;padding-inline-start:20px;display:flex;flex-direction:column;gap:4px">${r.steps.map(x => `<li>${esc(x)}</li>`).join("")}</ol></div>
    ${r.tip ? `<p class="sub" style="margin:0">💡 ${esc(r.tip)}</p>` : ""}`;
}
function recipeDialog(name, menuText) {
  const r = recipeOf(name); if (!r) return;
  const d = $("#dlg");
  d.innerHTML = `<form method="dialog" id="rcf"><h2>${esc(r.n)}</h2>${recipeHTML(r, menuText)}<div class="row"><button class="btn ghost" value="x">بستن</button></div></form>`;
  if (!d.open) d.showModal();
  d.scrollTop = 0;
}
// «برنامه»: every recipe the plan's menus use, once each
function recipesCard(p) {
  const seen = new Map();
  for (const c of Object.keys(MEAL_LABELS)) for (const m of menusFor(p, c)) { const r = recipeOf(m[0]); if (r && !seen.has(r.n)) seen.set(r.n, {r, m}); }
  if (!seen.size) return "";
  const list = [...seen.values()].sort((a, b) => recipeTime(b.r) - recipeTime(a.r));
  return `<section class="card"><h2>دستور پخت رژیمی</h2><p class="sub">برای منوهای برنامه‌ات؛ کم‌روغن و با فر، گریل یا بخار. مقدارها همیشه طبق منوی خودت.</p>
    ${list.map(({r, m}) => `<details><summary>${esc(r.n)} <span class="tag">${fa(recipeTime(r))} دقیقه</span></summary><div style="display:flex;flex-direction:column;gap:10px;margin-top:8px">${recipeHTML(r, "")}</div></details>`).join("")}</section>`;
}

const MET = {lift: 3.5, warm: 4, cool: 2.5, cardio: 6.5};
function sessionCost(w, kg) {
  let liftMin = 0, cardioMin = 0;
  const one = e => {
    const r = normFa(e.r), name = normFa(e.n);
    const mins = r.match(/(\d+)\s*دقیقه/) || name.match(/(\d+)\s*دقیقه/);
    if (mins && /تردمیل|دوچرخه|کاردیو|الپتیکال|پیاده|دویدن|طناب زدن/.test(name + " " + r)) { cardioMin += +mins[1]; return; }
    const sets = r.match(/(\d+)\s*ست/);
    const n = sets ? +sets[1] : Math.max(1, (r.match(/\d+/g) || []).length) || 3;
    liftMin += n * 2.25 + (e.d ? 1 : 0);
  };
  for (const e of w.ex) e.g ? e.items.forEach(one) : one(e);
  const min = 10 + liftMin + cardioMin + 5;
  const kcal = (MET.warm * 10 + MET.lift * liftMin + MET.cardio * cardioMin + MET.cool * 5) / 60 * kg;
  return {min, kcal};
}
function weekTraining(p, kg) {
  const per = {}, list = [];
  for (const [wk, w] of Object.entries(p.workouts || {})) per[wk] = sessionCost(w, kg);
  let week = 0, days = 0;
  for (const d of WEEK) {
    const k = String(p.week[d]); const st = stepsOf(p, k).find(s => s.workout);
    if (!st) continue;
    const wk = st.workout === true ? k : st.workout; if (!per[wk]) continue;
    week += per[wk].kcal; days++;
  }
  for (const [wk, w] of Object.entries(p.workouts || {})) list.push({name: w.label || w.name, ...per[wk]});
  return {list, week, days};
}

// «پرونده» card: the diet's calories a day, the gym program's calories, and what's left (deficit or surplus)
function calorieCard() {
  const p = plan(); if (!p) return "";
  const P = data.profile, L = latestBody() || {}, kg = num(L.weight) ?? num(P.weight) ?? 75;
  const keys = [...new Set(WEEK.map(d => String(p.week[d])))];
  const isTrain = k => stepsOf(p, k).some(s => s.workout);
  const avgOf = ks => { const ds = ks.map(k => dayNut(p, k)).filter(Boolean); if (!ds.length) return null; const a = x => ds.reduce((s, d) => s + d[x], 0) / ds.length; return {kcal: a("kcal"), p: a("p"), f: a("f"), c: a("c"), s: a("s"), lo: a("lo"), hi: a("hi")}; };
  const tr = avgOf(keys.filter(isTrain)), rs = avgOf(keys.filter(k => !isTrain(k)));
  const T = weekTraining(p, kg), restDays = 7 - T.days;
  const h = num(P.height), age = num(P.age);
  const bmr = num(L.bmr) || (h && age ? 10 * kg + 6.25 * h - 5 * age + (P.sex === "f" ? -161 : 5) : null);
  const base = bmr ? bmr * ({desk: 1.2, stand: 1.35, physical: 1.5})[data.quiz.job || "desk"] : null;
  const perSession = T.days ? T.week / T.days : 0;
  const r10 = x => fa(Math.round(x / 10) * 10, 0);
  let bal = null;
  if (base && (tr || rs)) {
    const dTr = (tr || rs).kcal - (base + perSession), dRs = (rs || tr).kcal - base;
    const week = dTr * T.days + dRs * restDays;
    bal = {day: week / 7, kgWeek: week / 7700};
  }
  const tile = (lab, val, em, flag) => `<div${flag ? ' class="flag"' : ""}><span>${lab}</span><b>${val}</b>${em ? `<em>${em}</em>` : ""}</div>`;
  const macro = tr || rs;
  return `<section class="card"><h2>کالری</h2>
    <div class="stats">
      ${tr ? tile("رژیم، روز تمرین", r10(tr.kcal) + " کالری", tr.hi - tr.lo > 50 ? `بین ${r10(tr.lo)} تا ${r10(tr.hi)}، بسته به منو` : "") : ""}
      ${rs ? tile("رژیم، روز استراحت", r10(rs.kcal) + " کالری", rs.hi - rs.lo > 50 ? `بین ${r10(rs.lo)} تا ${r10(rs.hi)}، بسته به منو` : "") : ""}
      ${macro ? tile("پروتئین", fa(macro.p, 0) + " گرم", "در روز") + tile("کربوهیدرات", fa(macro.c, 0) + " گرم", "در روز") + tile("چربی", fa(macro.f, 0) + " گرم", "در روز") + tile("قند", fa(macro.s, 0) + " گرم", "در روز", macro.s > 50) : ""}
      ${T.days ? tile("باشگاه در هفته", r10(T.week) + " کالری", `${fa(T.days, 0)} جلسه، هر جلسه حدود ${r10(perSession)}`) : ""}
      ${base ? tile("مصرف بدن بدون باشگاه", r10(base) + " کالری", "در روز، با کار روزانه" + (num(L.bmr) ? " (از BMR تست)" : "")) : ""}
      ${base && T.days ? tile("مصرف روز تمرین", r10(base + perSession) + " کالری", "بدن + باشگاه") : ""}
      ${bal ? tile(bal.day < 0 ? "کسری کالری" : "مازاد کالری", r10(Math.abs(bal.day)) + " در روز", `حدود ${fa(Math.abs(bal.kgWeek), 1)} کیلو ${bal.day < 0 ? "کم" : "اضافه"} در هفته`, bal.day > 0 && data.quiz.goal === "lose") : ""}
    </div>
    ${T.list.length ? `<details><summary>کالری هر جلسه باشگاه</summary><ul class="plain">${T.list.map(x => `<li>${esc(x.name)}: حدود ${fa(Math.round(x.min / 5) * 5, 0)} دقیقه، ${r10(x.kcal)} کالری</li>`).join("")}</ul></details>` : ""}
    <p class="sub" style="margin-top:8px">همه تقریبی‌اند: رژیم از مقدارهای نوشته‌شده در منوها (میانگین منوهای هر وعده) و باشگاه از تعداد ست‌ها و دقیقه‌های کاردیو با وزن فعلی‌ات حساب شده.</p>
  </section>`;
}

// files: images shrunk on the phone, kept on the server under the user's own account
async function shrink(file) {
  if (!file.type.startsWith("image/")) return file;
  try {
    const bmp = await createImageBitmap(file), k = Math.min(1, 1800 / Math.max(bmp.width, bmp.height));
    const c = document.createElement("canvas"); c.width = Math.round(bmp.width * k); c.height = Math.round(bmp.height * k);
    c.getContext("2d").drawImage(bmp, 0, 0, c.width, c.height);
    return await new Promise(r => c.toBlob(b => r(b || file), "image/jpeg", 0.85));
  } catch (e) { return file; }
}
async function addFile(file, cat) {
  const blob = await shrink(file);
  if (blob.size > 5e6) throw new Error("big");
  const id = rid(), type = blob.type || file.type;
  const r = await api("file/" + id, {method: "PUT", raw: blob, type});
  if (r.status === 415) throw new Error("type");
  if (!r.ok) throw new Error("net");
  data.files.push({id, name: file.name, cat, size: blob.size, type, date: localDate()});
  changed();
}

}

// for the user to check, then land where they belong (body numbers, menus, supplements, workouts) and the routine is rebuilt
let AI_ON = false;
const WKEY = {sat: 6, sun: 0, mon: 1, tue: 2, wed: 3, thu: 4, fri: 5};
const kindOf = cat => ["workout", "diet", "supp"].includes(cat) ? cat : "tests";
const str = (s, n = 400) => s == null ? "" : String(s).trim().slice(0, n);
// exercises the AI marked with the same group label (سوپرست…) become one group, like the hand-made plans
function groupEx(list) {
  const out = [];
  for (const e of list) {
    const x = {n: str(e.n, 120), r: str(e.r, 120), ...(e.d ? {d: 1} : {})}, g = str(e.g, 30);
    const last = out[out.length - 1];
    if (g && last && last.g === g && last.items.length < 4) last.items.push(x);
    else out.push(g ? {g, items: [x]} : x);
  }
  return out.map(e => e.items && e.items.length === 1 ? e.items[0] : e);
}
async function pdfLib() {
  if (!window.pdfjsLib) await new Promise((ok, no) => { const s = document.createElement("script"); s.src = "pdf.min.js"; s.onload = ok; s.onerror = no; document.head.appendChild(s); });
  pdfjsLib.GlobalWorkerOptions.workerSrc = "pdf.worker.min.js";
  return pdfjsLib;
}
const canvasJpeg = (c, q = 0.8) => c.toDataURL("image/jpeg", q);
async function prepFile(blob) {

    if (kinds.water && wake != null) {

      for (let m = wake + 120; m <= end; m += 120) { const t = at(iso, m); if (t > now + 30e3) out.push({at: t, tag: iso + ":water" + m, title: "یک لیوان آب", body: `هدف امروز: ${fa(p.water || 8)} لیوان یا بیشتر.`}); }
    }
  }
  return out.sort((a, b) => a.at - b.at).slice(0, 380);
}
let ppTimer = null;
function schedulePush() { clearTimeout(ppTimer); ppTimer = setTimeout(pushPlan, 2500); }
async function pushPlan(force) {
  if (!S || !data) return;
  const on = !!data.notify.on, key = "gym.pp." + S.user, last = LS.get(key);
  if (!on && !last) return; // never turned on here: nothing to send or clear
  const items = on ? reminders() : [], sig = items.map(x => x.at + x.tag + x.title + x.body).join("|");
  let h = 0; for (let i = 0; i < sig.length; i++) h = (h * 31 + sig.charCodeAt(i)) | 0;
  if (!force && last && last.h === h && Date.now() - last.t < 6 * 3600e3) return;
  try { await apiJSON("push/plan", {method: "PUT", body: {items}}); if (on) LS.set(key, {h, t: Date.now()}); else LS.del(key); } catch (e) {}
}
const b64u8 = s => { const b = atob(s.replace(/-/g, "+").replace(/_/g, "/") + "===".slice((s.length + 3) % 4)); return Uint8Array.from(b, c => c.charCodeAt(0)); };
async function pushReg() { return (await navigator.serviceWorker.getRegistration("./")) || navigator.serviceWorker.register("sw.js"); }
async function pushOn() {
  if ((await Notification.requestPermission()) !== "granted") throw new Error("perm");
  await pushReg(); const reg = await navigator.serviceWorker.ready;
  const {key} = await apiJSON("push/key");
  const sub = (await reg.pushManager.getSubscription()) || await reg.pushManager.subscribe({userVisibleOnly: true, applicationServerKey: b64u8(key)});
  const j = sub.toJSON();
  await apiJSON("push/sub", {method: "POST", body: {endpoint: j.endpoint, keys: j.keys}});
  LS.set("gym.push.ep", j.endpoint);
  if (!data.notify.on) { data.notify = {...data.notify, on: true}; touch("notify"); }
  await pushPlan(true);
}
async function pushOff() {
  const ep = LS.get("gym.push.ep");
  try { const reg = await navigator.serviceWorker.getRegistration("./"), sub = reg && await reg.pushManager.getSubscription(); if (sub) await sub.unsubscribe(); } catch (e) {}
  if (ep) await apiJSON("push/unsub", {method: "POST", body: {endpoint: ep}}).catch(() => {});
  LS.del("gym.push.ep");
}
function pushDialog() {
  const d = $("#dlg"), N = data.notify, kinds = {...NOTE_DEF, ...(N.kinds || {})}, here = !!LS.get("gym.push.ep");
  const home = navigator.standalone === true || matchMedia("(display-mode: standalone)").matches;
  let state;
  if (!pushable()) state = isIOS() && !home
    ? `<p class="note" style="margin:0">روی آیفون یادآور فقط وقتی کار می‌کنه که «روتین» رو <b>به صفحه اصلی</b> اضافه کرده باشی و از همون آیکن بازش کنی.</p><button class="btn ghost" type="button" id="puHow">روش اضافه کردن</button>`
    : `<p class="note" style="margin:0">این مرورگر نوتیفیکیشن نداره. روی آیفون از Safari و آیکن صفحه اصلی، روی اندروید از Chrome باز کن.</p>`;
  else if (Notification.permission === "denied") state = `<p class="note" style="margin:0">اجازه نوتیفیکیشن برای «روتین» بسته شده. ${isIOS() ? "توی Settings گوشی ‹ Notifications ‹ روتین، گزینه Allow Notifications رو روشن کن" : "از تنظیمات مرورگر، اجازه اعلان این سایت رو روشن کن"} و دوباره بیا این‌جا.</p>`;
  else state = here
    ? `<p class="okmsg" style="margin:0">✓ یادآورها روی این گوشی روشنه.</p><div class="row"><button class="btn ghost small" type="button" id="puTest">اعلان آزمایشی</button><button class="btn ghost small" type="button" id="puOff">خاموش روی این گوشی</button></div>`
    : `<button class="btn" type="button" id="puOn">روشن کردن یادآورها روی این گوشی</button>`;
  d.innerHTML = `<form method="dialog" id="puf"><h2>یادآورها</h2>
    <p class="sub" style="margin:0">سر ساعت هر کار برنامه‌ات یه نوتیفیکیشن روی گوشی میاد، حتی وقتی برنامه بسته‌ست. کاری که تیکش رو زده باشی یادآوری نمی‌شه.</p>
    ${state}
    <div><div class="sub" style="margin-bottom:6px">برای چی خبرم کنه</div>
      <div class="opts">${NOTE_KINDS.map(([k, l]) => `<label><input type="checkbox" name="k" value="${k}"${kinds[k] ? " checked" : ""}><span>${l}</span></label>`).join("")}</div></div>
    <div><div class="sub" style="margin-bottom:6px">چه موقع</div>
      <div class="seg" role="group" aria-label="چه موقع">${LEADS.map(([m, l]) => `<button type="button" data-lead="${m}" aria-pressed="${(+N.lead || 0) === m}">${l}</button>`).join("")}</div></div>
    <p class="sub" style="margin:0">یادآورها تا ۸ روز جلوتر آماده می‌شن و هر بار برنامه رو باز کنی تازه می‌شن؛ هفته‌ای یک بار بازش کن.</p>
    <div class="row"><button class="btn ghost" value="x">بستن</button></div></form>`;
  const save = () => { touch("notify"); LS.del("gym.pp." + S.user); schedulePush(); };
  d.querySelectorAll('[name="k"]').forEach(c => c.onchange = () => { data.notify = {...data.notify, kinds: {...NOTE_DEF, ...(data.notify.kinds || {}), [c.value]: c.checked}}; save(); });
  d.querySelectorAll("[data-lead]").forEach(b => b.onclick = () => { data.notify = {...data.notify, lead: +b.dataset.lead}; save(); d.querySelectorAll("[data-lead]").forEach(x => x.setAttribute("aria-pressed", String(x === b))); });
  const busy = (b, t) => { b.disabled = true; b.textContent = t; };
  if ($("#puHow")) $("#puHow").onclick = () => { d.close(); installHint(true); };
  if ($("#puOn")) $("#puOn").onclick = async ev => {
    busy(ev.target, "در حال روشن کردن…");
    try { await pushOn(); toast("یادآورها روشن شد"); }
    catch (e) { toast(e.message === "perm" ? "اجازه نوتیفیکیشن داده نشد" : "روشن نشد؛ اینترنت رو چک کن و دوباره امتحان کن"); }
    pushDialog(); if (TAB === "today") render();
  };
  if ($("#puTest")) $("#puTest").onclick = async ev => {
    busy(ev.target, "در حال ارسال…");
    try { const r = await apiJSON("push/test", {method: "POST"}); toast(r.ok ? "فرستاده شد؛ تا چند ثانیه دیگه میاد" : "سرویس نوتیفیکیشن جواب نداد؛ بعداً دوباره امتحان کن"); }
    catch (e) { toast(e.message === "no_sub" ? "این گوشی ثبت نیست؛ خاموش و روشنش کن" : "نشد؛ اینترنت رو چک کن"); }
    ev.target.disabled = false; ev.target.textContent = "اعلان آزمایشی";
  };
  if ($("#puOff")) $("#puOff").onclick = async ev => { busy(ev.target, "…"); await pushOff(); toast("روی این گوشی خاموش شد"); pushDialog(); };
  if (!d.open) d.showModal();
}

// ---------- opened in a phone's browser (not from the home-screen icon): ask to add it to the home screen
let installEv = null;
addEventListener("beforeinstallprompt", ev => { ev.preventDefault(); installEv = ev; const b = $("#ihGo"); if (b) b.hidden = false; });
function installHint() {
  const ua = navigator.userAgent;
  const ios = /iPhone|iPad|iPod/.test(ua) || (/Macintosh/.test(ua) && navigator.maxTouchPoints > 1);
  const phone = ios || /Android/i.test(ua);
  const home = navigator.standalone === true || matchMedia("(display-mode: standalone)").matches || matchMedia("(display-mode: fullscreen)").matches;
  if (!phone || home) return;
  const share = `<svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="vertical-align:-3px"><path d="M12 3v12M8 7l4-4 4 4"/><path d="M6 11H5v10h14V11h-1"/></svg>`;
  const steps = ios
    ? `<li>دکمه اشتراک‌گذاری ${share} رو بزن (اگه پایین صفحه نیست، اول دکمه <b>•••</b> رو بزن).</li>
       <li>گزینه <b>Add to Home Screen</b> (افزودن به صفحه اصلی) رو بزن.</li><li>بالا سمت راست <b>Add</b> رو بزن.</li>`
    : `<li>منوی <b>⋮</b> مرورگر رو بزن.</li><li>گزینه <b>Add to Home screen</b> یا <b>Install app</b> رو بزن.</li>`;
  const d = $("#dlg");
  d.innerHTML = `<form method="dialog" id="ihf"><img src="icon-180.png" alt="" width="56" height="56" style="border-radius:14px;align-self:center">
    <h2 style="text-align:center;margin:0">روتین رو به صفحه اصلی گوشی اضافه کن</h2>
    <p class="sub" style="margin:0">این صفحه توی مرورگر باز شده. برای اینکه درست کار کنه (تمام‌صفحه، با آیکن خودش و بدون پاک شدن ورود)، اول به صفحه اصلی اضافه‌اش کن و بعد از همون آیکن باز کن:</p>
    <ol style="list-style-type:persian;margin:0;padding-inline-start:20px;display:flex;flex-direction:column;gap:6px;font-size:.92rem">${steps}</ol>
    <p class="sub" style="margin:0">بعد از باز کردن از آیکن، یک بار دوباره وارد شو.</p>
    <div class="row"><button class="btn" type="button" id="ihGo" hidden>نصب</button><button class="btn ghost" value="x">فعلاً نه</button></div></form>`;
  if (installEv) $("#ihGo").hidden = false;
  $("#ihGo").onclick = async () => { if (!installEv) return; installEv.prompt(); try { await installEv.userChoice; } catch (e) {} installEv = null; d.close(); };
  d.showModal();
}

// ---------- start + keep in sync
setInterval(() => { if (S && document.visibilityState === "visible") sync(); }, 20000);
document.addEventListener("visibilitychange", () => { if (S && document.visibilityState === "visible") sync(); });
addEventListener("online", () => S && sync());
(async () => {
  installHint();
  STORE =localStorage.getItem("gym.s") ? localStorage : sessionStorage;
  const s = LS.get("gym.s", STORE);
  if (s && s.token) { try { await startSession(s); return; } catch (e) { LS.del("gym.s"); } }
  // a shared link (…/gym/?u=name) fills in the username
  const u = new URLSearchParams(location.search).get("u");
  $("#login").hidden = false;
  if (u) { $("#lu").value = u; $("#lp").focus(); }
})();
</script>
