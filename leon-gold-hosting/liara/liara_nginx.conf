# Extra rules for Liara's static platform (included inside its server block).
# The ledger's service worker and pages must never be cached, or the phone keeps an old build.
location = /daftar/sw.js { add_header Cache-Control "no-cache"; }
location = /daftar/index.html { add_header Cache-Control "no-cache"; }
# Next.js build files have a hash in their name: cache them for a year.
location /_next/static/ { add_header Cache-Control "public, max-age=31536000, immutable"; }
